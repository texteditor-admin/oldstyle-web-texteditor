<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Editor Preview Showcase</title>
  <link rel="stylesheet" href="../dist/oldstyle-web-texteditor.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #7c98b3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
    }
    #capture-wrapper {
      width: 1040px;
      margin: 0 auto;
      background: #ffffff;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.15);
      border: 1px solid #cbd5e1;
      height: 1350px;
      overflow: hidden;
    }
    #editor {
      height: 100%;
    }
    .rye-container {
      height: 100% !important;
    }
    .rye-scroll-area {
      height: calc(100% - 150px) !important;
      background: #7c98b3 !important;
      padding: 24px 0 !important;
    }
    /* Ensure page is centered and crisp */
    .rye-page {
      box-shadow: 0 6px 20px rgba(0,0,0,0.2) !important;
      margin: 0 auto !important;
    }
  </style>
</head>
<body>

<div id="capture-wrapper">
  <div id="editor"></div>
</div>

<script src="../dist/oldstyle-web-texteditor.umd.js"></script>
<script>
  const sampleDocument = `
    <p style="text-align: center; font-weight: bold; margin-bottom: 20pt; font-size: 13pt;">
      T.C.<br>
      İÇİŞLERİ BAKANLIĞI<br>
      Bilgi Teknolojileri Genel Müdürlüğü
    </p>

    <div style="display: flex; justify-content: space-between; margin-bottom: 12pt;">
      <span><strong>Sayı :</strong> E-70438294-700.01-00124</span>
      <span>16.10.2026</span>
    </div>
    <p style="margin-bottom: 18pt;"><strong>Konu :</strong> Resmi Yazışma Sistemi & Web Editör Entegrasyonu</p>

    <p style="text-align: center; font-weight: bold; margin: 22pt 0 16pt 0;">DAĞITIM YERLERİNE</p>

    <p style="text-indent: 1.25cm; text-align: justify; line-height: 1.15; margin-bottom: 12pt;">
      T.C. Cumhurbaşkanlığı Resmî Yazışmalarda Uygulanacak Usul ve Esaslar Hakkında Yönetmelik (Madde 8) hükümlerine uygun olarak hazırlanan bu sistem; 1.5 cm kenar boşlukları, 18 cm gövde genişliği ve 1.25 cm ilk satır girintisi ile doğrudan web tarayıcıları üzerinden masaüstü kalitesinde belge üretilmesini sağlamaktadır.
    </p>

    <table style="width: 100%; border-collapse: collapse; margin: 14pt 0; font-size: 11pt;">
      <thead>
        <tr style="background-color: #f1f5f9;">
          <th style="border: 1px solid #94a3b8; padding: 6px 10px; width: 60px; text-align: center;">Sıra</th>
          <th style="border: 1px solid #94a3b8; padding: 6px 10px; text-align: left;">Sistem Bileşeni</th>
          <th style="border: 1px solid #94a3b8; padding: 6px 10px; text-align: left;">Mevzuat & Teknik Standart</th>
          <th style="border: 1px solid #94a3b8; padding: 6px 10px; width: 100px; text-align: center;">Durum</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="border: 1px solid #94a3b8; padding: 6px 10px; text-align: center;">1</td>
          <td style="border: 1px solid #94a3b8; padding: 6px 10px;">Fiziksel Çok Sayfalı A4 Motoru</td>
          <td style="border: 1px solid #94a3b8; padding: 6px 10px;">210x297 mm Sayfalama & Otomatik Bölme</td>
          <td style="border: 1px solid #94a3b8; padding: 6px 10px; text-align: center; color: #16a34a; font-weight: bold;">Tam Uyumlu</td>
        </tr>
        <tr>
          <td style="border: 1px solid #94a3b8; padding: 6px 10px; text-align: center;">2</td>
          <td style="border: 1px solid #94a3b8; padding: 6px 10px;">CKEditor 4 Drop-in Soketi</td>
          <td style="border: 1px solid #94a3b8; padding: 6px 10px;">Kendo UI & OLGU EBYS Uyumluluğu</td>
          <td style="border: 1px solid #94a3b8; padding: 6px 10px; text-align: center; color: #16a34a; font-weight: bold;">Tam Uyumlu</td>
        </tr>
        <tr>
          <td style="border: 1px solid #94a3b8; padding: 6px 10px; text-align: center;">3</td>
          <td style="border: 1px solid #94a3b8; padding: 6px 10px;">Word (.docx) İçe / Dışa Aktarım</td>
          <td style="border: 1px solid #94a3b8; padding: 6px 10px;">ECMA-376 OpenXML Biçimlendirme</td>
          <td style="border: 1px solid #94a3b8; padding: 6px 10px; text-align: center; color: #16a34a; font-weight: bold;">Tam Uyumlu</td>
        </tr>
      </tbody>
    </table>

    <p style="text-indent: 1.25cm; text-align: justify; line-height: 1.15; margin-bottom: 24pt;">
      Bilgilerini ve gereğini arz/rica ederim.
    </p>

    <div style="display: flex; justify-content: flex-end; margin-top: 26pt; text-align: center;">
      <div style="min-width: 200px;">
        <p style="margin: 0; font-weight: bold; font-size: 12pt;">Ahmet YILMAZ</p>
        <p style="margin: 0; font-size: 11pt;">Genel Müdür</p>
        <p style="margin: 4pt 0 0 0; font-size: 9pt; color: #64748b;">(e-İmzalıdır)</p>
      </div>
    </div>
  `;

  ResmiYaziEditor.create('#editor', {
    initialData: sampleDocument,
    pageMargin: '1.5cm 1.5cm 0.5cm 1.5cm',
    lineHeight: '1.15',
    paragraphSpacing: '0pt',
    firstLineIndent: '1.25cm'
  }).then(editor => {
    const badge = editor.container.querySelector('.rye-ruler-line-badge');
    if (badge) {
      badge.textContent = 'Satır 1: 1.25 cm';
      badge.style.display = 'block';
    }
  });
</script>
</body>
</html>
